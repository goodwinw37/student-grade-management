spring.application.name=student-grade-management
server.port=2800
spring.datasource.url=jdbc:h2:mem:test;MODE=PostgreSQL;
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
app.demo.admin-password=${DEMO_ADMIN_PASSWORD:dev-admin}
app.demo.teacher-password=${DEMO_TEACHER_PASSWORD:dev-teacher}
app.demo.student-password=${DEMO_STUDENT_PASSWORD:dev-student}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.defer-datasource-initialization=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.h2.console.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
